name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # make consumer resolves Dimension from this repository's git history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: make ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux_amd64
          path: docs/results/

  forks:
    # Both demos on forks of the real chains, through public RPCs unless these
    # secrets name others. Public endpoints rate-limit, so this job cannot fail the run.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: make fidelity replay moonwell feeds
      # The deployment on Base Sepolia, re-read from the chain.
      - run: make live
      # All 21 planted bugs, including the two only a fork can catch.
      - run: make mutants FORKS=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-forks-linux_amd64
          path: docs/results/

  compat:
    # Fe 26.7.0, the other release Dimension supports: every ingot, every unit
    # suite on its backends, and every compile-fail case.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-compat-linux_amd64
          path: docs/results/compat/

  mutants:
    # Each planted bug in the safety-critical code must be caught by the check
    # meant for it, for the reason expected of it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: make mutants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-mutants-linux_amd64
          path: docs/results/mutants/

  web:
    # The site renders the reports committed under web/data; this keeps it building.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
