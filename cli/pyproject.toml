# The Dimension command line as an installable tool:
#   pipx install "git+https://github.com/Femtech-web/Dimension#subdirectory=cli"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimension-cli"
version = "0.3.1"
description = "Start a Fe project on Dimension, and check it before deploying"
readme = { text = "See https://github.com/Femtech-web/Dimension#use-it-in-your-protocol", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Source = "https://github.com/Femtech-web/Dimension"

[project.scripts]
dimension = "dimension:main"

[tool.setuptools]
py-modules = ["dimension", "feed_check"]
